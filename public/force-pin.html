<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تغيير كلمة المرور | أكاديمية التفوق</title>
  <link rel="stylesheet" href="./css/style.css?v=login-fixed-layout-1" />
  <link rel="stylesheet" href="./css/app.css?v=forgot-pin-2" />
</head>
<body class="app-shell force-pin-page">
  <main class="auth-layout">
    <section class="auth-card">
      <a class="brand-link" href="./index.html">أكاديمية التفوق</a>
      <p class="eyebrow">تنبيه أمني</p>
      <h1>غيّر كلمة المرور الآن</h1>
      <p class="force-pin-intro">دخلت باستخدام كلمة مرور مؤقتة. يجب إنشاء كلمة مرور شخصية جديدة قبل متابعة حسابك.</p>
      <form id="force-pin-form" class="stack-form">
        <label for="new-pin">كلمة المرور الجديدة</label>
        <input id="new-pin" name="newPin" type="password" inputmode="numeric" autocomplete="new-password" pattern="[0-9]{4}" minlength="4" maxlength="4" required />
        <label for="confirm-pin">تأكيد كلمة المرور الجديدة</label>
        <input id="confirm-pin" name="confirmPin" type="password" inputmode="numeric" autocomplete="new-password" pattern="[0-9]{4}" minlength="4" maxlength="4" required />
        <p id="force-pin-error" class="form-error" hidden aria-live="polite"></p>
        <p id="force-pin-success" class="form-success" hidden aria-live="polite"></p>
        <button id="force-pin-submit" class="cta-button cta-secondary" type="submit">حفظ كلمة المرور الجديدة</button>
      </form>
      <p class="muted">كلمة المرور الجديدة يجب أن تتكون من أربعة أرقام، ولا تشاركها مع أي شخص.</p>
    </section>
  </main>
  <script src="./js/session-storage.js"></script>
  <script src="./js/force-pin.js?v=forgot-pin-3"></script>
  <script src="./js/in-app-browser-gate.js?v=telegram-gate-2" defer></script>
</body>
</html>
