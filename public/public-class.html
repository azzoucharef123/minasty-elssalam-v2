<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>دعوة حصة مباشرة | أكاديمية التفوق</title>
  <style>
    :root { color-scheme: dark; --ink: #e5eefc; --muted: #9fb0c9; --panel: #12213a; --edge: rgba(148,163,184,.22); --blue: #2563eb; --red: #dc2626; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; font-family: Tahoma, Arial, sans-serif; color: var(--ink); background: radial-gradient(circle at top right,#193e7d 0,transparent 35%), #071222; }
    button, input { font: inherit; }
    .shell { width: min(1200px, 100%); min-height: 100dvh; margin: auto; padding: 1rem; display: grid; grid-template-rows: auto 1fr; gap: 1rem; }
    .top { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.85rem 1rem; border:1px solid var(--edge); border-radius:1rem; background:rgba(15,31,56,.84); }
    .brand { display:flex; align-items:center; gap:.7rem; font-weight:800; }
    .brand i { display:grid; place-items:center; width:2.45rem; height:2.45rem; border-radius:.75rem; font-style:normal; color:#fff; background:linear-gradient(135deg,#3b82f6,#1d4ed8); }
    .role { margin:0; color:#bfdbfe; font-size:.84rem; font-weight:700; }
    .layout { min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 19rem; gap:1rem; }
    .stage, .chat { min-height:0; border:1px solid var(--edge); border-radius:1.1rem; background:rgba(15,31,56,.88); box-shadow:0 16px 38px rgba(0,0,0,.18); }
    .stage { display:grid; grid-template-rows:minmax(18rem,1fr) auto; overflow:hidden; }
    .screen-wrap { position:relative; display:grid; min-height:0; place-items:center; background:#020617; }
    video { width:100%; height:100%; max-height:68dvh; object-fit:contain; background:#020617; }
    .placeholder { position:absolute; inset:0; display:grid; place-content:center; padding:1.5rem; color:var(--muted); text-align:center; font-weight:700; line-height:1.9; }
    .placeholder strong { color:#e0ecff; font-size:1.12rem; }
    .controls { display:flex; flex-wrap:wrap; gap:.65rem; padding:1rem; border-top:1px solid var(--edge); }
    .button { min-height:2.75rem; padding:.55rem .9rem; border:0; border-radius:.7rem; color:#fff; font-weight:800; cursor:pointer; }
    .button.primary { background:linear-gradient(135deg,#2563eb,#1d4ed8); }
    .button.danger { background:#b91c1c; }
    .button.ghost { background:#263b5b; }
    .button[hidden], .host-only[hidden] { display:none; }
    .invite { display:grid; grid-template-columns:1fr auto; gap:.5rem; width:100%; padding:.7rem; border:1px solid rgba(96,165,250,.3); border-radius:.8rem; background:#102a51; }
    .invite label { grid-column:1/-1; color:#bfdbfe; font-size:.78rem; font-weight:800; }
    .invite input { min-width:0; padding:.65rem; color:#e0ecff; border:1px solid var(--edge); border-radius:.5rem; background:#071a32; direction:ltr; }
    .chat { display:grid; grid-template-rows:auto 1fr auto; overflow:hidden; }
    .chat header { padding:1rem; border-bottom:1px solid var(--edge); }
    .chat h2 { margin:0; font-size:1rem; }
    .chat small { color:var(--muted); }
    .messages { min-height:10rem; padding:.8rem; overflow:auto; display:flex; flex-direction:column; gap:.55rem; }
    .message { max-width:92%; padding:.55rem .65rem; border-radius:.7rem; background:#1e365b; line-height:1.55; word-break:break-word; }
    .message strong { display:block; margin-bottom:.12rem; color:#bfdbfe; font-size:.73rem; }
    .chat form { display:flex; gap:.5rem; padding:.75rem; border-top:1px solid var(--edge); }
    .chat input { min-width:0; flex:1; padding:.65rem; color:#e5eefc; border:1px solid var(--edge); border-radius:.6rem; background:#091a31; }
    .chat button { min-width:3.25rem; }
    .status { margin:0; padding:.55rem 1rem; color:#cbd5e1; font-size:.84rem; font-weight:700; }
    .status.error { color:#fecaca; }
    @media (max-width: 800px) { .layout { grid-template-columns:1fr; grid-template-rows:minmax(27rem,1fr) 19rem; } .stage { min-height:0; } .screen-wrap { min-height:18rem; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="brand"><i>ت</i><span>أكاديمية التفوق<br><small>حصة بدعوة عامة</small></span></div>
      <p id="public-role" class="role">جارٍ تجهيز الدعوة…</p>
    </header>
    <section class="layout">
      <section class="stage" aria-label="البث المباشر">
        <div class="screen-wrap">
          <video id="public-video" playsinline autoplay></video>
          <div id="public-placeholder" class="placeholder"><div><strong>بانتظار بدء الحصة</strong><br>سيظهر البث هنا فور أن يبدأ الأستاذ مشاركة الشاشة والصوت.</div></div>
        </div>
        <div class="controls">
          <div id="invite-box" class="invite host-only" hidden>
            <label for="public-invite-link">رابط الدعوة العام</label>
            <input id="public-invite-link" readonly />
            <button id="copy-public-link" class="button ghost" type="button">نسخ الرابط</button>
          </div>
          <button id="start-public-share" class="button primary host-only" type="button" hidden>بدء الحصة ومشاركة الشاشة</button>
          <button id="end-public-class" class="button danger host-only" type="button" hidden>إنهاء الحصة العامة</button>
          <p id="public-status" class="status">جارٍ الاتصال…</p>
        </div>
      </section>
      <aside class="chat" aria-label="دردشة الحصة">
        <header><h2>الدردشة</h2><small>الدردشة متاحة لجميع الحاضرين</small></header>
        <div id="public-chat-messages" class="messages" aria-live="polite"></div>
        <form id="public-chat-form"><input id="public-chat-input" maxlength="800" autocomplete="off" placeholder="اكتب رسالة…" /><button class="button primary" type="submit">إرسال</button></form>
      </aside>
    </section>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="./js/public-class.js"></script>
</body>
</html>
