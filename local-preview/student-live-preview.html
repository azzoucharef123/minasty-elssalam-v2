<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>معاينة بث التلميذ</title>
  <style>
    :root { color-scheme: dark; --navy:#0b1220; --panel:#171b26; --line:rgba(148,163,184,.2); --blue:#2563eb; --safe-bottom:env(safe-area-inset-bottom,0px); }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--navy); font-family:Tahoma,Arial,sans-serif; }
    body { color:#f8fafc; }
    button { font:inherit; cursor:pointer; }
    .app { position:fixed; inset:0; display:grid; grid-template-rows:64px minmax(0,1fr); overflow:hidden; background:var(--navy); }
    .topbar { display:grid; grid-template-columns:auto 1fr auto auto; align-items:center; gap:8px; padding:0 10px; background:rgba(15,23,42,.98); border-bottom:1px solid var(--line); box-shadow:0 5px 18px rgba(2,6,23,.3); }
    .brand,.level,.count,.mail { min-height:38px; display:flex; align-items:center; justify-content:center; border:1px solid rgba(96,165,250,.32); border-radius:11px; background:rgba(30,64,175,.22); }
    .brand { justify-content:flex-start; gap:7px; padding:4px 8px; white-space:nowrap; }
    .brand-mark { width:27px; height:27px; display:grid; place-items:center; border-radius:9px; background:#2563eb; font-size:15px; }
    .brand strong { display:block; font-size:12px; }
    .brand small { display:block; color:#94a3b8; font-size:9px; margin-top:2px; }
    .level { justify-self:center; padding:5px 10px; font-size:11px; white-space:nowrap; }
    .count { padding:5px 9px; color:#dbeafe; font-size:10px; white-space:nowrap; }
    .mail { position:relative; width:38px; color:#dbeafe; font-size:18px; text-decoration:none; }
    .stage { display:grid; grid-template-rows:minmax(0,1fr) auto 400px; min-height:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior-y:contain; background:#0b1220; }
    .video { position:relative; min-height:260px; display:grid; place-items:center; overflow:hidden; background:#020617; border-bottom:1px solid var(--line); }
    .board { width:92%; height:88%; max-height:520px; border:10px solid #b98248; border-radius:5px; background:linear-gradient(135deg,#153a45,#0e2532 54%,#173c43); box-shadow:0 8px 20px #0008, inset 0 0 0 3px #e8bd7c; display:grid; place-items:center; position:relative; overflow:hidden; }
    .board:before { content:"∑   π   E = mc²   F = ma   √x²+y²"; position:absolute; top:19%; left:9%; right:9%; color:#d9f4e7; font-size:clamp(12px,2.8vw,24px); letter-spacing:2px; opacity:.86; transform:rotate(-2deg); }
    .board:after { content:"الحصة المباشرة\A\Aفي انتظار مشاركة شاشة الأستاذ"; white-space:pre; text-align:center; color:#fff7df; font-weight:900; font-size:clamp(20px,5.5vw,44px); line-height:1.45; text-shadow:0 2px 4px #000; }
    .placeholder { position:absolute; right:5%; bottom:5%; left:5%; padding:10px 14px; border-radius:10px; background:#020617cc; text-align:center; color:#e2e8f0; font-size:clamp(11px,2.5vw,16px); }
    .controls { min-height:78px; display:grid; grid-template-columns:repeat(3,1fr); gap:7px; padding:8px 10px calc(8px + var(--safe-bottom)); background:rgba(15,23,42,.98); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .control { min-height:58px; border:1px solid #93c5fd99; border-radius:12px; color:#eff6ff; background:linear-gradient(135deg,#2563eb,#1d4ed8); box-shadow:0 5px 14px #1e40af3d; font-size:clamp(10px,2.8vw,15px); font-weight:900; }
    .control:active { transform:scale(.96); opacity:.86; }
    .chat { height:400px; min-height:400px; max-height:400px; overflow:hidden; display:grid; grid-template-rows:46px minmax(0,1fr) 74px; background:var(--panel); }
    .chat-head { display:flex; align-items:center; padding:0 14px; background:#121827; border-bottom:1px solid var(--line); }
    .chat-head h2 { margin:0; font-size:14px; }
    .messages { overflow-y:auto; padding:14px; }
    .empty { margin:0; color:#94a3b8; font-size:12px; text-align:center; }
    .chat-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:9px 10px calc(9px + var(--safe-bottom)); background:#121827; border-top:1px solid var(--line); }
    .chat-btn { min-height:54px; border:1px solid #93c5fd99; border-radius:11px; color:#fff; background:#1d4ed8; font-size:13px; font-weight:900; }
    .chat-btn:active { transform:scale(.96); }
    .modal { position:fixed; inset:0; z-index:10; display:none; place-items:center; padding:20px; background:#020617aa; backdrop-filter:blur(5px); }
    .modal.open { display:grid; }
    .modal-card { width:min(100%,420px); padding:18px; border:1px solid #60a5fa88; border-radius:18px; background:#172033; box-shadow:0 20px 55px #000b; }
    .modal-card h3 { margin:0 0 12px; font-size:18px; }
    textarea { width:100%; min-height:130px; resize:none; border:1px solid #64748b; border-radius:12px; padding:12px; color:#fff; background:#0f172a; font-size:16px; outline:none; }
    .modal-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
    .modal-row button { min-height:46px; border:0; border-radius:10px; color:#fff; font-weight:900; }
    .send { background:#2563eb; } .close { background:#475569; }
    @media (max-width:430px) { .app { grid-template-rows:58px minmax(0,1fr); } .topbar { gap:4px; padding:0 6px; } .brand { padding:3px 5px; } .brand strong { font-size:10px; } .brand small { font-size:8px; } .brand-mark { width:24px; height:24px; } .level { padding:4px 5px; font-size:9px; } .count { padding:4px 5px; font-size:8px; } .mail { width:32px; min-height:34px; } .board { width:96%; height:84%; border-width:7px; } .controls { min-height:70px; padding:6px 6px; gap:4px; } .control { min-height:52px; font-size:9px; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="mail" href="#" aria-label="مراسلة الأستاذ">✉</a>
      <div class="count">مشاركاتي: 0</div>
      <div class="level">السنة الأولى متوسط　▣</div>
      <div class="brand"><span class="brand-mark">⌂</span><span><strong>أكاديمية التفوق</strong><small>الحصة المباشرة</small></span></div>
    </header>
    <main class="stage">
      <section class="video" aria-label="شاشة الحصة">
        <div class="board"></div>
        <div class="placeholder">صوت الأستاذ يعمل، وستظهر الشاشة المشتركة هنا عند بدء المشاركة.</div>
      </section>
      <nav class="controls" aria-label="أدوات الحصة">
        <button class="control" type="button" onclick="alert('هذه معاينة محلية فقط')">↻ تحديث الصوت والصورة</button>
        <button class="control" type="button" onclick="document.documentElement.classList.toggle('landscape-demo')">⟳ تدوير الشاشة</button>
        <button class="control" type="button" onclick="alert('تمت معاينة زر رفع اليد')">✋ رفع اليد</button>
      </nav>
      <aside class="chat" aria-label="الدردشة مع الأستاذ">
        <header class="chat-head"><h2>طرح سؤال على الأستاذ</h2></header>
        <div class="messages"><p class="empty">ستظهر رسالتك ورد الأستاذ هنا.</p></div>
        <div class="chat-actions"><button class="chat-btn" type="button" onclick="alert('في الموقع الحقيقي يفتح هذا زر التصوير الكاميرا الأمامية')">▣ تصوير</button><button class="chat-btn" type="button" onclick="openMessage()">✉ إرسال رسالة</button></div>
      </aside>
    </main>
  </div>
  <div id="message-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card"><h3 id="modal-title">إرسال رسالة للأستاذ</h3><textarea id="message" placeholder="اكتب رسالتك هنا..."></textarea><div class="modal-row"><button class="send" type="button" onclick="sendMessage()">إرسال</button><button class="close" type="button" onclick="closeMessage()">إلغاء</button></div></div>
  </div>
  <script>
    function openMessage(){ document.getElementById('message-modal').classList.add('open'); setTimeout(()=>document.getElementById('message').focus(),50); }
    function closeMessage(){ document.getElementById('message-modal').classList.remove('open'); }
    function sendMessage(){ const value=document.getElementById('message').value.trim(); if(!value){ alert('اكتب الرسالة أولًا'); return; } document.querySelector('.empty').textContent='رسالتك: '+value; document.getElementById('message').value=''; closeMessage(); }
    document.getElementById('message-modal').addEventListener('click',e=>{ if(e.target.id==='message-modal') closeMessage(); });
  </script>
</body>
</html>
